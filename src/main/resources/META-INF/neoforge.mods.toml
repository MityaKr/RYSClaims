modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"

[[mixins]]
config = "rysclaims.mixins.json"

[[mixins]]
config = "rysclaims.compat.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
Chunk claims for teams: claim land, keep it force-loaded and decide who may do what by RYSTeams roles, allies and trusted players. Protection covers players, explosions, mobs and other mods' machines; land and rights can be imported from FTB Chunks.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ryscore"
type = "required"
versionRange = "[${ryscore_version},2.0.0)"
ordering = "AFTER"
side = "BOTH"
