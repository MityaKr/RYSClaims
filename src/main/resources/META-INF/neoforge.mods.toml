modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"

[[mixins]]
config = "rysclaims.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
Land for teams: claims, force loading and protection that know RYSTeams roles. Replaces FTB Chunks claims.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ryscore"
type = "required"
versionRange = "[${ryscore_version},2.0.0)"
ordering = "AFTER"
side = "BOTH"
